query getActiveIndianCities {
  getActiveIndianCities {
    _id
    value
    state
  }
}

query getActiveEventCategories {
  getActiveEventCategories {
    _id
    value
    description
  }
}

query getActiveGenreTags {
  getActiveGenreTags {
    _id
    value
  }
}

# Languages + prohibited items masters for the Event Guide /
# Prohibited Items multiselects in EventJourney "Additional details".
# Both sorted server-side: languages by isIndian → order → value;
# prohibited by order → value. Spec: docs/EVENT_FIELDS_SPEC.md §4.
query getActiveLanguages {
  getActiveLanguages {
    _id
    code
    value
    nativeName
    isIndian
    order
  }
}

query getActiveProhibitedItems {
  getActiveProhibitedItems {
    _id
    slug
    value
    description
    order
  }
}

query GetConfig($type: ConfigTypeEnum!) {
  getConfig(type: $type) {
    _id
    type
    valueType
    textVal
    numVal
    boolVal
    createdBy {
      firstName
      lastName
    }
    updatedBy {
      firstName
      lastName
    }
    createdAt
    updatedAt
  }
}

query GetMarketingPricing {
  getMarketingPricing {
    emailRate
    smsRate
    whatsappRate
    pushRate
    gstPercent
    platformFeePercent
    currency
  }
}
