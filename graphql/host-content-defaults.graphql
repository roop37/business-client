query getMyHostContentDefaults {
  getMyHostContentDefaults {
    _id
    hostId
    ticketingTerms
    refundPolicy
  }
}

mutation saveMyHostContentDefaults($input: SaveHostContentDefaultsInput!) {
  saveMyHostContentDefaults(input: $input) {
    _id
    hostId
    ticketingTerms
    refundPolicy
  }
}
