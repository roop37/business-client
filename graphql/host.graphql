# import "./fragments.graphql"

query getHostsByBusiness {
  getHostsByBusiness {
    _id
    name
    email
    phone
    hostType
    venueType
    description
    logo
    businessRegistrationNumber
    gstNumber
    websiteUrl
    averageEventSize
    profileComplete
    status
    onboardingCompleted
    isAdminVerified
    isActive
    address {
      ...addressInfo
    }
    createdAt
    updatedAt
  }
}

query getHost {
  getHost {
    _id
    name
    email
    phone
    hostType
    venueType
    description
    logo
    businessRegistrationNumber
    gstNumber
    websiteUrl
    averageEventSize
    profileComplete
    status
    onboardingCompleted
    isAdminVerified
    isActive
    address {
      ...addressInfo
    }
    createdAt
    updatedAt
  }
}

query getHostDashboardSummary($input: HostDashboardSummaryInput) {
  getHostDashboardSummary(input: $input) {
    upcomingEventsCount
    publishedEventsCount
    draftEventsCount
    salesToday
    ticketsSoldToday
    salesLast30Days
    ticketsSoldLast30Days
    orderCountLast30Days
    averageOrderValueLast30Days
    pendingSettlementsCount
    paidOutLifetime
    marketingSubscribersCount
    lifetimeCampaignMessagesSent
    salesSeries {
      date
      label
      sales
      tickets
      orderCount
    }
    salesBySource {
      label
      amount
      count
      percent
    }
    ticketMix {
      label
      amount
      count
      percent
    }
    topItems {
      label
      amount
      count
      percent
    }
    upcomingCampaigns {
      id
      name
      status
      scheduledFor
      recipientCount
    }
  }
}

mutation createHost($input: CreateHostInput!) {
  createHost(input: $input)
}

mutation updateHost($input: UpdateHostInput!) {
  updateHost(input: $input)
}

mutation uploadHostLogo($logo: String!) {
  uploadHostLogo(logo: $logo)
}
